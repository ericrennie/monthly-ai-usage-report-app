name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS Apple Silicon
          - os: macos-15-intel
            label: macOS Intel
          - os: windows-latest
            label: Windows x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependency
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Build and self-test desktop package
        run: python scripts/build_desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
