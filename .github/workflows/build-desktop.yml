name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS Apple Silicon
          - os: macos-15-intel
            label: macOS Intel
          - os: windows-latest
            label: Windows x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build dependency
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install optional Apple Developer ID
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/monthly-ai-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p actions "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p actions "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$signing_identity"
          echo "MACOS_CODESIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Configure optional Apple notarization
        if: runner.os == 'macOS' && env.MACOS_NOTARY_PRIVATE_KEY_BASE64 != ''
        shell: bash
        run: |
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key"
          xcrun notarytool store-credentials monthly-ai-notary \
            --key "$notary_key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID"
          echo "MACOS_NOTARY_KEYCHAIN_PROFILE=monthly-ai-notary" >> "$GITHUB_ENV"
      - name: Build and self-test desktop package
        run: python scripts/build_desktop_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
      - name: Remove temporary Apple signing keychain
        if: always() && runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
